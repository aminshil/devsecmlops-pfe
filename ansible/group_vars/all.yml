---
repo_dir: "{{ (playbook_dir + '/..') | realpath }}"
k8s_namespace: ml-serving
# Image tag follows the VERSION file -- the single source of truth also
# read by the API (/health) and the Jenkins build tag.
api_version: "{{ lookup('ansible.builtin.file', playbook_dir + '/../VERSION') | trim }}"
api_image: "devsecmlops-api:{{ api_version }}"
# Third-party images, pinned by digest to the ones running on the VM (scripts/pin_versions.py writes
# these lines; re-run it to move a pin). A floating tag (:latest, :community) would pull whatever is
# newest at the next run.
img_grafana: "grafana/grafana@sha256:1c1bd67c54c5fcf6e759897852b5a584191bd6796e8d328a5ace457799801261"
img_node_exporter: "prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0"
img_registry: "registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373"
# MinIO is not pulled: MinIO no longer publishes its free images (docs/SOURCES.md, 115). The prerequisites
# role downloads the release binary from GitHub, refuses it unless its SHA-256 is minio_sha256 (from the
# release's own .sha256sum file; scripts/pin_versions.py rewrites it), and builds minio/Dockerfile
# (FROM scratch, uid minio_uid). To use another MinIO image, set img_minio; nothing is built then.
minio_release: "RELEASE.2025-09-07T16-13-09Z"
minio_sha256: "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f"
minio_uid: 10002
minio_image_local: "devsecmlops-minio:{{ minio_release }}"
minio_build_dir: /var/lib/devsecmlops/minio-build
# where a browser reaches the MinIO console (host port 9002 = the container's console port 9001). MinIO sends
# a browser that opens the S3 API port (9001) there; without it, it sent the browser to its own internal
# console port, 9001, which on the host is the API port again: a redirect loop (VPS, 2 November)
minio_console_url: "http://localhost:9002"
img_minio: "{{ minio_image_local }}"
img_sonarqube: "sonarqube:24.04@sha256:160bd2f6a3485bd09b655ef22dd63c02bd1fa7ba82aa5d9973fd010b8bcca0b3"
# MLflow is not pulled: the prerequisites role builds mlflow/Dockerfile (python base pinned by digest, MLflow and
# boto3 by version). mlflow_version is the one in requirements.txt: the training scripts and the Jenkins model
# job (Jenkinsfile.model) run the same one (tests/test_mlflow_container.py checks that they agree).
mlflow_version: "3.17.2"
mlflow_image: "devsecmlops-mlflow:{{ mlflow_version }}"
mlflow_uid: 10003
port_control_panel: 8000
port_grafana: 3000
port_prometheus: 9090
port_node_exporter: 9100
port_k8s_exporter: 9400
port_registry: 5000
cp_model_name: telecom_v3
cp_database_url: "postgresql://x:x@localhost:9999/n"
bin_prometheus: /usr/local/bin/prometheus
bin_minikube: /usr/local/bin/minikube
bin_kubectl: /usr/local/bin/kubectl

# --- credentials: supplied from the environment at run time, never stored ---
#   export GRAFANA_ADMIN_PASSWORD=...  OPS_UI_PASSWORD=...
grafana_admin_password: "{{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_PASSWORD') }}"
ops_ui_user: "{{ lookup('ansible.builtin.env', 'OPS_UI_USER') | default('operator', true) }}"
ops_ui_password: "{{ lookup('ansible.builtin.env', 'OPS_UI_PASSWORD') }}"
# Optional: protects POST /feedback on the cluster API and the control panel (empty = open, as in the demo)
feedback_token: "{{ lookup('ansible.builtin.env', 'FEEDBACK_TOKEN') }}"
kubeconfig_path: /home/pfe/.kube/config
minikube_home: /home/pfe/.minikube
# uid of the jenkins user in the Jenkins image (the official image's): the only user granted the cluster files
jenkins_uid: 1000
# Docker network shared by Jenkins, SonarQube, the registry and MinIO (name resolution between them)
docker_net_name: devsecmlops-net
# interpreter for the virtualenv: Python 3.12 or newer (numpy 2.5.4 supports 3.12-3.14). Ubuntu 22.04 ships 3.10:
# install python3.12 (deadsnakes PPA) and run with -e venv_python=python3.12 (docs/INFRASTRUCTURE_SETUP.md)
venv_python: python3
minio_root_user: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_USER') }}"
minio_root_password: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') }}"
jenkins_image_tag: "2.2"   # 2.2: base image and tools pinned with checksums (jenkins/Dockerfile)
# This installation's site: each data centre has its own name, its own data (data/sites/<site>/) and
# its own models (the Jenkins model store, scripts/model_store.py). Jenkins gets it as PFE_SITE, and
# both jobs use it when their SITE parameter is left empty. Set once per machine in
# /root/.devsecmlops.env (export PFE_SITE='sfax'); unset means 'default', the original VM.
site_name: "{{ lookup('ansible.builtin.env', 'PFE_SITE') | default('default', true) }}"
