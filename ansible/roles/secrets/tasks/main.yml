---
# ===========================================================================
# secrets role [PRODUCTION profile only].
# Creates a real Kubernetes Secret for the database credentials instead of the
# demo's placeholder DSN. The password comes from an Ansible Vault variable
# (vault_db_password) - never hardcoded in the repo. The deployment references
# this Secret via secretKeyRef.
#
# Create the vault first:
#   ansible-vault create ansible/group_vars/production_secrets.yml
#   # add:  vault_db_password: "<real password>"
# Then run:  ansible-playbook site.yml -e profile=production --ask-vault-pass
# ===========================================================================

- name: Guard - refuse to proceed with a placeholder password
  ansible.builtin.fail:
    msg: >
      db_password is still the placeholder. Provide the real password via
      Ansible Vault (vault_db_password) before running the production profile.
  when: db_password == 'CHANGE_ME_VIA_VAULT'

- name: Ensure the namespace exists
  ansible.builtin.command: "kubectl create namespace {{ k8s_namespace }} --dry-run=client -o yaml"
  register: ns_yaml
  changed_when: false

- name: Apply the namespace
  ansible.builtin.shell: "echo '{{ ns_yaml.stdout }}' | kubectl apply -f -"
  register: kubectl_ns
  changed_when: "'created' in kubectl_ns.stdout"
  failed_when: false

- name: Create the database credentials Secret (rendered client-side)
  ansible.builtin.command: >
    kubectl create secret generic db-credentials
    --namespace {{ k8s_namespace }}
    --from-literal=username={{ db_user }}
    --from-literal=password={{ db_password }}
    --from-literal=dbname={{ db_name }}
    --dry-run=client -o yaml
  register: secret_yaml
  changed_when: false
  no_log: true

- name: Apply the Secret
  ansible.builtin.shell: "echo '{{ secret_yaml.stdout }}' | kubectl apply -f -"
  no_log: true
  changed_when: true
