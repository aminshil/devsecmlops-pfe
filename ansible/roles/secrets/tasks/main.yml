---
# ===========================================================================
# secrets role [PRODUCTION profile only].
# Creates the postgres-credentials Secret from an Ansible Vault value.
#
# The Secret NAME and KEYS must match what kubernetes/deployment.yaml and the
# postgres StatefulSet actually read (POSTGRES_USER / POSTGRES_PASSWORD /
# POSTGRES_DB). In demo the same Secret is generated with a random password
# by scripts/ensure_db_secret.sh; in production this role creates it instead.
#
#   ansible-vault create ansible/group_vars/production_secrets.yml
#   # add:  vault_db_password: "<real password>"
#   ansible-playbook site.yml -e profile=production --ask-vault-pass
# ===========================================================================

- name: Guard - refuse to proceed with a placeholder password
  ansible.builtin.fail:
    msg: >
      db_password is still the placeholder. Provide the real password via
      Ansible Vault (vault_db_password) before running the production profile.
  when: db_password == 'CHANGE_ME_VIA_VAULT'

- name: Ensure the namespace exists
  ansible.builtin.command: "{{ bin_kubectl }} create namespace {{ k8s_namespace }} --dry-run=client -o yaml"
  register: ns_yaml
  changed_when: false

- name: Apply the namespace
  ansible.builtin.command: "{{ bin_kubectl }} apply -f -"
  args:
    stdin: "{{ ns_yaml.stdout }}"
  register: kubectl_ns
  changed_when: "'created' in kubectl_ns.stdout"
  failed_when: false

- name: Apply the postgres-credentials Secret (built here, sent on stdin only)
  # The manifest is assembled by Ansible with base64-encoded values and fed
  # to kubectl on stdin: the password never appears on any command line or
  # in the process list, and no shell quoting is involved.
  ansible.builtin.command: "{{ bin_kubectl }} apply -f -"
  args:
    stdin: "{{ pg_secret_manifest | to_json }}"
  vars:
    pg_secret_manifest:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: postgres-credentials
        namespace: "{{ k8s_namespace }}"
      data:
        POSTGRES_USER: "{{ db_user | b64encode }}"
        POSTGRES_PASSWORD: "{{ db_password | b64encode }}"
        POSTGRES_DB: "{{ db_name | b64encode }}"
  no_log: true
  changed_when: true
