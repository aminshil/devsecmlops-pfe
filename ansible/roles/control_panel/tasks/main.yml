---
# ===========================================================================
# control_panel: the mission-control web UI + serving API (L0/L1).
# Runs as a host process on :8000 so its /ui/status and /ui/infra endpoints
# have native access to kubectl, docker, and Prometheus on the VM (a
# container cannot reach those). demo profile ONLY -- production explicitly
# sets run_control_panel: false, since this is an ops/demo convenience, not
# a serving component (see group_vars/production.yml).
#
# Supervised by systemd (Restart=always) rather than a bare nohup process:
# a plain background process does not survive a VM reboot, which is exactly
# what happened during defense-prep testing -- every Docker-based layer
# (Jenkins, Grafana, ...) came back on its own after a reboot, but the
# control panel stayed down until restarted by hand. systemd closes that
# gap the same way the monitoring_systemd role already does for production.
# ===========================================================================

- name: Install the control-panel systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/control-panel.service
    mode: "0644"
    content: |
      [Unit]
      Description=DevSecMLOps control panel + serving API (:{{ port_control_panel }})
      After=network.target docker.service

      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ repo_dir }}
      Environment=MODEL_NAME={{ cp_model_name }}
      Environment=PREDICT_THRESHOLD={{ cp_predict_threshold }}
      Environment=DATABASE_URL={{ cp_database_url }}
      ExecStart={{ repo_dir }}/venv/bin/uvicorn api.app:app --host 0.0.0.0 --port {{ port_control_panel }}
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  become: true

- name: Reload systemd, enable and start the control panel
  ansible.builtin.systemd:
    name: control-panel.service
    daemon_reload: true
    enabled: true
    state: started
  become: true

- name: Wait for the control panel to answer on its port
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ port_control_panel }}"
    timeout: 30

- name: Fetch platform layer status from the control panel
  ansible.builtin.uri:
    url: "http://localhost:{{ port_control_panel }}/ui/status"
    return_content: true
  register: status_resp
  failed_when: false

- name: Report how many layers are up
  ansible.builtin.debug:
    msg: >-
      Control panel live at http://<vm-ip>:{{ port_control_panel }}/ui —
      {{ (status_resp.json.up | default('?')) }}/{{ (status_resp.json.total | default('?')) }} layers up
  when: status_resp.json is defined
