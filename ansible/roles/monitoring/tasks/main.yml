---
# ===========================================================================
# monitoring: the observability stack (L5), identical for both profiles.
#   - Grafana         container, restart=always, provisioned from the repo:
#                     datasource (fixed uid) + dashboard JSON, read-only
#   - node-exporter   container, restart=always, host rootfs (real disk/CPU)
#   - Prometheus      systemd unit; scrapes node-exporter, the k8s exporter,
#                     the host API and every serving pod individually
#                     (Kubernetes discovery through the API server)
#   - k8s-exporter    systemd unit (pod readiness, restarts, replicas, HPA)
#   - production-agent systemd unit, demo profile only: one agent per
#                     machine replaying the independent test set against
#                     the serving pods (in production, real agents do this)
# Every host process is supervised by systemd (Restart=always, enabled at
# boot), so a VM reboot brings the whole stack back without intervention.
# ===========================================================================

- name: Require a Grafana admin password from the environment
  ansible.builtin.assert:
    that: grafana_admin_password | length >= 12
    fail_msg: "Set GRAFANA_ADMIN_PASSWORD (12+ chars) in the environment before running the playbook."
  no_log: true

- name: Ensure node-exporter is running (host rootfs for real disk metrics)
  community.docker.docker_container:
    name: node-exporter
    image: "{{ img_node_exporter }}"
    state: started
    restart_policy: always
    network_mode: host
    volumes:
      - "/:/host:ro,rslave"
    command: "--path.rootfs=/host"

- name: Ensure Grafana is running (persistent volume, provisioned from the repo)
  community.docker.docker_container:
    name: grafana
    image: "{{ img_grafana }}"
    state: started
    restart_policy: always
    network_mode: host
    env:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "{{ repo_dir }}/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "{{ repo_dir }}/monitoring/grafana/dashboards:/var/lib/grafana/dashboards/devsecmlops:ro"
  no_log: true

- name: Prometheus data directory (persistent, not /tmp)
  ansible.builtin.file:
    path: /var/lib/prometheus
    state: directory
    mode: "0750"
  become: true

- name: Install monitoring systemd units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}.service"
    mode: "0644"
    content: |
      [Unit]
      Description={{ item.description }}
      After=network.target docker.service

      [Service]
      Type=simple
      WorkingDirectory={{ repo_dir }}
      Environment=KUBECONFIG={{ kubeconfig_path }}
      ExecStart={{ item.exec }}
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  loop:
    - name: prometheus
      description: "Prometheus (:{{ port_prometheus }})"
      exec: "{{ bin_prometheus }} --config.file={{ repo_dir }}/monitoring/prometheus.yml --storage.tsdb.path=/var/lib/prometheus"
    - name: k8s-exporter
      description: "Kubernetes object exporter (:9400)"
      exec: "{{ repo_dir }}/venv/bin/python3 monitoring/k8s_exporter.py"
    - name: production-agent
      description: "Demo traffic: one monitoring agent per machine -> /predict"
      exec: "{{ repo_dir }}/venv/bin/python3 monitoring/production_agent.py --target k8s"
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Enable and start Prometheus and the k8s exporter
  ansible.builtin.systemd:
    name: "{{ item }}"
    daemon_reload: true
    enabled: true
    state: started
  loop: [prometheus, k8s-exporter]
  become: true

- name: Production agent (demo traffic) -- enabled in demo, disabled in production
  ansible.builtin.systemd:
    name: production-agent
    daemon_reload: true
    enabled: "{{ run_production_agent | default(false) }}"
    state: "{{ 'started' if (run_production_agent | default(false)) else 'stopped' }}"
  become: true

- name: Remove units of the retired replay-exporter / anomaly-bridge design
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [replay-exporter, anomaly-bridge]
  become: true
  failed_when: false

- name: Delete retired unit files and stop leftover background processes
  ansible.builtin.shell: |
    set -o pipefail
    rm -f /etc/systemd/system/replay-exporter.service /etc/systemd/system/anomaly-bridge.service
    pkill -f 'monitoring/(replay_exporter|anomaly_bridge|fleet_simulator).py' || true
    systemctl daemon-reload
  args:
    executable: /bin/bash
  become: true
  changed_when: false

- name: Wait for Prometheus to answer on its port
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ port_prometheus }}"
    timeout: 30
