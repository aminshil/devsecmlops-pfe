---
# ===========================================================================
# prerequisites: verify required binaries and bring up the always-on support
# containers (registry, minio, sonarqube, jenkins) with their real named
# volumes. These use restart=always so they survive Docker restarts.
# ===========================================================================
- name: Verify required binaries are installed
  ansible.builtin.command: "which {{ item }}"
  changed_when: false
  loop: [docker, minikube, kubectl, prometheus]
  register: bin_check
  failed_when: bin_check.rc != 0

- name: Check the Python virtualenv exists
  ansible.builtin.stat:
    path: "{{ repo_dir }}/venv/bin/activate"
  register: venv_stat

- name: Warn if virtualenv is missing
  ansible.builtin.debug:
    msg: "venv not found at {{ repo_dir }}/venv — create with: python3 -m venv venv && pip install -r requirements.txt"
  when: not venv_stat.stat.exists

- name: Ensure local Docker registry is running
  community.docker.docker_container:
    name: registry
    image: "{{ img_registry }}"
    state: started
    restart_policy: always
    ports: ["{{ port_registry }}:5000"]
    volumes: ["registry_data:/var/lib/registry"]

- name: Ensure MinIO (MLflow artifact store) is running
  community.docker.docker_container:
    name: minio
    image: "minio/minio"
    state: started
    restart_policy: always
    command: 'server /data --console-address ":9001"'
    ports: ["9001:9000", "9002:9001"]
    volumes: ["minio_data:/data"]

- name: Ensure SonarQube (SAST) is running
  community.docker.docker_container:
    name: sonarqube
    image: "sonarqube:community"
    state: started
    restart_policy: always
    ports: ["9000:9000"]
    volumes:
      - "sonarqube_data:/opt/sonarqube/data"
      - "sonarqube_extensions:/opt/sonarqube/extensions"
      - "sonarqube_logs:/opt/sonarqube/logs"
  # From the host: http://localhost:9000. From inside the Jenkins container the
  # CI pipeline reaches it as http://sonarqube:9000 (Docker name resolution).
  # Both are correct in their respective network contexts.

- name: Build the custom Jenkins image (python3, kubectl, minikube, sonar-scanner, docker CLI, trivy)
  community.docker.docker_image:
    name: devsecmlops-jenkins
    tag: "2.0"
    build:
      path: "{{ repo_dir }}/jenkins"
      pull: false
    source: build
    force_source: false

- name: Ensure Jenkins (CI/CD) is running
  community.docker.docker_container:
    name: jenkins
    image: "devsecmlops-jenkins:2.0"
    state: started
    restart_policy: always
    ports: ["8080:8080", "50000:50000"]
    volumes:
      - "jenkins_home:/var/jenkins_home"
      - "/var/run/docker.sock:/var/run/docker.sock"
      # The K8s automated-deploy pipeline stage bind-mounts the host's LIVE
      # kubeconfig/certs directly (not a one-time copy) -- Minikube
      # regenerates its CA on every full cluster rebuild, which silently
      # broke a copy-based setup every single time. A bind mount always
      # reflects whatever is currently valid on disk, with zero action
      # needed after either a gentle restart or a full rebuild.
      - "/home/pfe/.kube:/home/pfe/.kube"
      - "/home/pfe/.minikube:/home/pfe/.minikube"
  # networks left to the "Attach Jenkins to its required networks" task
  # below, which is also what jenkins-networks.service re-asserts on every
  # boot -- see that task for why a static `networks:` list here isn't
  # enough on its own.

- name: Attach Jenkins to its required networks (devsecmlops-net for SonarQube/registry DNS, minikube for the K8s API)
  community.docker.docker_network:
    name: "{{ item }}"
    connected: ["jenkins"]
    appends: true
  loop:
    - devsecmlops-net
    - minikube

- name: Install the jenkins-networks systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/jenkins-networks.service
    mode: "0644"
    content: |
      [Unit]
      Description=Ensure Jenkins is attached to devsecmlops-net and minikube networks
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/bin/bash -c 'for i in $(seq 1 30); do docker inspect jenkins >/dev/null 2>&1 && break; sleep 2; done; docker network connect devsecmlops-net jenkins 2>/dev/null; docker network connect minikube jenkins 2>/dev/null; exit 0'

      [Install]
      WantedBy=multi-user.target
  become: true
  # Ansible re-attaching the networks above only fixes THIS playbook run.
  # A later `minikube delete` recreates the 'minikube' Docker network from
  # scratch, silently dropping Jenkins' connection again -- and Ansible
  # isn't re-run on every such event. This unit is the boot-time (and,
  # since docker network connect is idempotent, effectively any-time-it's-
  # started) safety net for that ongoing case: confirmed live, tonight,
  # to fix a real recurring "sonarqube: Name or service not known" /
  # Kubernetes-API-unreachable failure without any manual step.

- name: Reload systemd, enable and start jenkins-networks
  ansible.builtin.systemd:
    name: jenkins-networks.service
    daemon_reload: true
    enabled: true
    state: started
  become: true
