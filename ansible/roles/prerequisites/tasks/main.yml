---
# ===========================================================================
# prerequisites: verify required binaries and bring up the always-on support
# containers (registry, minio, sonarqube, jenkins) with their real named
# volumes. These use restart=always so they survive Docker restarts.
# ===========================================================================
- name: Verify required binaries are installed
  ansible.builtin.command: "which {{ item }}"
  changed_when: false
  check_mode: false   # read-only probe: runs for real in --check so later 'when:' tests are right
  loop: [docker, minikube, kubectl, prometheus]
  register: bin_check
  failed_when: bin_check.rc != 0

- name: Check the Python virtualenv exists
  ansible.builtin.stat:
    path: "{{ repo_dir }}/venv/bin/activate"
  register: venv_stat

- name: Warn if virtualenv is missing
  ansible.builtin.debug:
    msg: "venv not found at {{ repo_dir }}/venv — create with: python3 -m venv venv && pip install -r requirements.txt"
  when: not venv_stat.stat.exists

- name: Ensure the platform Docker network exists ({{ docker_net_name }})
  # Every support container below joins it, and Jenkins reaches them by name over it. Nothing created it:
  # a clean machine stopped at the registry with "network devsecmlops-net not found" (VPS test, 1 November).
  community.docker.docker_network:
    name: "{{ docker_net_name }}"
    state: present

- name: Raise vm.max_map_count for SonarQube's Elasticsearch (persistent, applied now)
  # SonarQube's documentation requires at least 524288 (docs/SOURCES.md, 114); Ubuntu's default is
  # 65530 (VPS test, 1 November: set by hand there).
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-sonarqube.conf
    mode: "0644"
    content: |
      # SonarQube (Elasticsearch): written by the Ansible prerequisites role
      vm.max_map_count=524288
  register: sysctl_file
  become: true

- name: Apply the sysctl setting (when the file changed)
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-sonarqube.conf
  when: sysctl_file.changed
  changed_when: true
  become: true

- name: Ensure local Docker registry is running
  community.docker.docker_container:
    name: registry
    image: "{{ img_registry }}"
    state: started
    restart_policy: always
    ports: ["{{ port_registry }}:5000"]
    volumes: ["registry_data:/var/lib/registry"]
    # Jenkins reaches this by container name (registry:5000) for its
    # post-push catalog check. Declared here so Ansible enforces it on
    # every run -- undeclared, a container recreation (image update,
    # config drift) silently drops back to the default bridge network,
    # confirmed live: this exact thing happened to registry, minio, and
    # sonarqube after an unrelated recreation, breaking Jenkins' DNS
    # resolution to sonarqube with no warning until the next build ran.
    networks:
      - name: "{{ docker_net_name | default('devsecmlops-net') }}"

- name: MinIO (image, data volume, container, MLflow bucket)
  ansible.builtin.include_tasks: minio.yml

- name: Ensure /etc/devsecmlops exists (root-only)
  ansible.builtin.file:
    path: /etc/devsecmlops
    state: directory
    mode: "0700"
  become: true

- name: Write the MLflow server environment (root-only, never in the unit file)
  ansible.builtin.copy:
    dest: /etc/devsecmlops/mlflow.env
    mode: "0600"
    content: |
      MLFLOW_S3_ENDPOINT_URL=http://localhost:9001
      AWS_ACCESS_KEY_ID={{ minio_root_user }}
      AWS_SECRET_ACCESS_KEY={{ minio_root_password }}
  become: true
  no_log: true

- name: Install the MLflow tracking server unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/mlflow.service
    mode: "0644"
    content: |
      [Unit]
      Description=MLflow tracking server (:5001, artifacts proxied to MinIO)
      After=network.target docker.service

      [Service]
      EnvironmentFile=/etc/devsecmlops/mlflow.env
      WorkingDirectory={{ repo_dir }}
      # --artifacts-destination + --serve-artifacts: clients (the training
      # pipeline, the Jenkins model job) upload artifacts THROUGH the tracking
      # server, so MinIO credentials exist only on this host service.
      ExecStart={{ repo_dir }}/venv/bin/mlflow server --host 0.0.0.0 --port 5001 \
        --backend-store-uri sqlite:///{{ repo_dir }}/mlflow.db \
        --artifacts-destination s3://mlflow-artifacts/ --serve-artifacts
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  become: true

- name: Enable and start MLflow
  ansible.builtin.systemd:
    name: mlflow.service
    daemon_reload: true
    enabled: true
    state: started
  become: true

# The Jenkins model job reaches MLflow on the host through Docker's default bridge (Jenkinsfile.model:
# MLFLOW_TRACKING_URI=http://172.17.0.1:5001; Jenkins' address there is 172.17.0.x). On a host whose
# firewall (ufw) is active with a default-deny policy, that traffic is dropped and the full scope stops
# at "MLflow is not reachable" (VPS test, 1 November). One rule opens the port to that bridge only;
# nothing changes on the public interface. Hosts without ufw, or with ufw inactive, are left alone.
- name: Check whether ufw is installed and active
  ansible.builtin.command: ufw status
  register: ufw_status
  changed_when: false
  failed_when: false   # expected: ufw not installed (rc 127/2) -- then there is nothing to open
  check_mode: false   # read-only probe
  become: true

- name: Read Docker's default bridge (subnet and gateway)
  ansible.builtin.command: >-
    docker network inspect bridge
    -f '{{ '{{' }}(index .IPAM.Config 0).Subnet{{ '}}' }} {{ '{{' }}(index .IPAM.Config 0).Gateway{{ '}}' }}'
  register: docker_bridge
  changed_when: false
  check_mode: false   # read-only probe
  when: "'Status: active' in ufw_status.stdout"

- name: Allow the Docker bridge to reach MLflow (:5001) through ufw
  ansible.builtin.command: >-
    ufw allow from {{ docker_bridge.stdout.split()[0] }} to {{ docker_bridge.stdout.split()[1] }}
    port 5001 proto tcp comment 'Jenkins container -> MLflow'
  register: ufw_rule
  changed_when: "'Rule added' in ufw_rule.stdout"
  become: true
  when: "'Status: active' in ufw_status.stdout"

- name: Ensure SonarQube (SAST) is running
  community.docker.docker_container:
    name: sonarqube
    image: "{{ img_sonarqube }}"
    state: started
    restart_policy: always
    ports: ["9000:9000"]
    volumes:
      - "sonarqube_data:/opt/sonarqube/data"
      - "sonarqube_extensions:/opt/sonarqube/extensions"
      - "sonarqube_logs:/opt/sonarqube/logs"
    networks:
      - name: "{{ docker_net_name | default('devsecmlops-net') }}"
  # From the host: http://localhost:9000. From inside the Jenkins container the
  # CI pipeline reaches it as http://sonarqube:9000 (Docker name resolution).
  # Both are correct in their respective network contexts.

- name: Read the group that owns the Docker socket (the Jenkins user must be in it)
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_sock

- name: Build the custom Jenkins image (python3, kubectl, minikube, sonar-scanner, docker CLI, trivy)
  community.docker.docker_image:
    name: devsecmlops-jenkins
    tag: "{{ jenkins_image_tag }}"
    build:
      path: "{{ repo_dir }}/jenkins"
      pull: false
      # the socket's group id on THIS host (999 on the original VM and the VPS; other installs differ)
      args:
        DOCKER_GID: "{{ docker_sock.stat.gid }}"
    source: build
    force_source: false

- name: Ensure Jenkins (CI/CD) is running
  community.docker.docker_container:
    name: jenkins
    image: "devsecmlops-jenkins:{{ jenkins_image_tag }}"
    state: started
    restart_policy: always
    ports: ["8080:8080", "50000:50000"]
    volumes:
      - "jenkins_home:/var/jenkins_home"
      - "/var/run/docker.sock:/var/run/docker.sock"
      # The K8s automated-deploy pipeline stage bind-mounts the host's LIVE
      # kubeconfig/certs directly (not a one-time copy) -- Minikube
      # regenerates its CA on every full cluster rebuild, which silently
      # broke a copy-based setup every single time. A bind mount always
      # reflects whatever is currently valid on disk, with zero action
      # needed after either a gentle restart or a full rebuild.
      - "/home/pfe/.kube:/home/pfe/.kube"
      - "/home/pfe/.minikube:/home/pfe/.minikube"
      # Versioned datasets for the model pipeline job (Jenkinsfile.model),
      # read-only: training never modifies its inputs.
      - "{{ repo_dir }}/data:/var/jenkins_home/fleet-data:ro"
  # networks left to the "Attach Jenkins to its required networks" task
  # below, which is also what jenkins-networks.service re-asserts on every
  # boot -- see that task for why a static `networks:` list here isn't
  # enough on its own.

- name: Check that the jenkins user can use the Docker socket (its image was built for another group id otherwise)
  ansible.builtin.command: docker exec jenkins docker version --format '{{ '{{' }}.Server.Version{{ '}}' }}'
  register: jenkins_docker
  changed_when: false
  failed_when: jenkins_docker.rc != 0
  when: not ansible_check_mode   # in a dry run the container may not exist yet
  # On failure: the image predates this host's socket group. Rebuild it:
  #   docker rm -f jenkins && docker rmi devsecmlops-jenkins:{{ jenkins_image_tag }}   then re-run the playbook
  # (jobs and credentials live in the jenkins_home volume, which is kept)

- name: Start the cluster before attaching Jenkins to its network (only Minikube may create "minikube")
  # docker_network below would otherwise create a plain network of that name on a machine where
  # Minikube never ran, with the wrong address range (formerly worked around by a first pass with
  # --tags system,app_setup,kubernetes; docs/INFRASTRUCTURE_SETUP.md section 5)
  ansible.builtin.include_role:
    name: kubernetes
    tasks_from: cluster

- name: Attach Jenkins to its required networks (devsecmlops-net for SonarQube/registry DNS, minikube for the K8s API)
  community.docker.docker_network:
    name: "{{ item }}"
    connected: ["jenkins"]
    appends: true
  loop:
    - "{{ docker_net_name }}"
    - minikube

- name: Install the jenkins-networks systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/jenkins-networks.service
    mode: "0644"
    content: |
      [Unit]
      Description=Ensure Jenkins is attached to devsecmlops-net and minikube networks
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/bin/bash -c 'for i in $(seq 1 30); do docker inspect jenkins >/dev/null 2>&1 && break; sleep 2; done; docker network connect devsecmlops-net jenkins 2>/dev/null; docker network connect minikube jenkins 2>/dev/null; exit 0'

      [Install]
      WantedBy=multi-user.target
  become: true
  # Ansible re-attaching the networks above only fixes THIS playbook run.
  # A later `minikube delete` recreates the 'minikube' Docker network from
  # scratch, silently dropping Jenkins' connection again -- and Ansible
  # isn't re-run on every such event. This unit is the boot-time (and,
  # since docker network connect is idempotent, effectively any-time-it's-
  # started) safety net for that ongoing case: confirmed live, tonight,
  # to fix a real recurring "sonarqube: Name or service not known" /
  # Kubernetes-API-unreachable failure without any manual step.

- name: Reload systemd, enable and start jenkins-networks
  ansible.builtin.systemd:
    name: jenkins-networks.service
    daemon_reload: true
    enabled: true
    state: started
  become: true
