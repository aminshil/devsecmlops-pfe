---
# ===========================================================================
# DevSecMLOps platform — infrastructure as code (L6), two profiles.
#
#   PRODUCTION (systemd services, real K8s Secrets, resource limits, K8s-only):
#     ansible-playbook -i inventory.ini site.yml -e profile=production --ask-vault-pass
#
#   DEMO (the jury-facing setup: full tooling, host processes, control panel):
#     ansible-playbook -i inventory.ini site.yml -e profile=demo
#     ansible-playbook -i inventory.ini site.yml            # demo is the default
#
# Common roles (system install, app setup, kubernetes) run in both profiles.
# Profile-specific roles are gated by the variables in group_vars/<profile>.yml.
#
# Safe validation without changing anything:
#   ansible-playbook -i inventory.ini site.yml -e profile=production --check
#   ansible-playbook -i inventory.ini site.yml --syntax-check
# ===========================================================================
- name: DevSecMLOps platform bring-up
  hosts: platform
  gather_facts: true

  vars:
    _profile_default: "demo"

  # Every task (and the scripts it runs) uses the cluster files the Jenkins container mounts, whatever
  # the shell that started the play exported. Without this, minikube and kubectl as root use
  # /root/.minikube and /root/.kube, a second cluster Jenkins cannot see (VPS test, 1 November).
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    MINIKUBE_HOME: "{{ minikube_home }}"

  pre_tasks:
    # Tagged `always`: they define `profile` and load its variables, so a run limited with --tags
    # (docs/INFRASTRUCTURE_SETUP.md section 5) still has them. Untagged, --tags skipped them and the
    # first role stopped on "'profile' is undefined" (VPS test, 1 November).
    - name: Profile and preconditions
      tags: [always]
      block:
        - name: Require ansible-core 2.17 or newer (community.docker 5.x refuses older ones)
          ansible.builtin.assert:
            that: ansible_version.full is version('2.17.0', '>=')
            fail_msg: >-
              ansible-core {{ ansible_version.full }} is too old: the community.docker collection needs 2.17
              or newer. Ubuntu 22.04's apt package is 2.10: apt-get remove -y ansible &&
              pip3 install ansible-core==2.17.14 (docs/INFRASTRUCTURE_SETUP.md, section 1).
            quiet: true
        - name: Resolve the profile (CLI -e profile=... takes priority)
          ansible.builtin.set_fact:
            profile: "{{ profile | default(_profile_default) }}"
        - name: Load the selected profile's variables
          ansible.builtin.include_vars: "group_vars/{{ profile }}.yml"
        - name: Look for the Vault-encrypted production secrets file
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/group_vars/production_secrets.yml"
          register: _prod_secrets
          when: profile == 'production'
        - name: Load the production secrets (vault_db_password)
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/group_vars/production_secrets.yml"
          when: profile == 'production' and _prod_secrets.stat.exists
          # Without that file db_password stays CHANGE_ME_VIA_VAULT and the secrets role stops with a clear message.
        - name: Check the site name (it becomes a directory of the model store)
          ansible.builtin.assert:
            that: site_name is match('^[a-z0-9][a-z0-9_-]{0,31}$')
            fail_msg: >-
              site_name '{{ site_name }}' (PFE_SITE) is not a valid site name: lowercase letters, digits,
              - and _ only, 32 characters at most (scripts/model_store.py).
            quiet: true
        - name: Announce the profile
          ansible.builtin.debug:
            msg: "Bringing up the platform with the '{{ profile }}' profile for site '{{ site_name }}'."

  roles:
    # --- common to both profiles ---
    - role: system
      tags: [system, install]
    - role: app_setup
      tags: [app_setup, setup]

    # --- demo-only support tooling (registry/minio/sonarqube/jenkins) ---
    - role: prerequisites
      when: run_support_containers | default(false)
      tags: [prerequisites]

    # --- production secrets (real K8s Secret for the DB) ---
    - role: secrets
      when: use_k8s_secret_for_db | default(false)
      tags: [secrets, production]

    # --- Kubernetes serving (both, prod adds limits + secret ref) ---
    - role: kubernetes
      tags: [kubernetes, k8s]

    # --- monitoring: systemd-supervised in both profiles; the demo profile
    #     additionally runs the production agent as a traffic source ---
    - role: monitoring
      tags: [monitoring]

    # --- demo-only mission-control panel on :8000 ---
    - role: control_panel
      when: run_control_panel | default(false)
      tags: [control_panel, demo]
