# DevSecMLOps platform — runs on a single Ubuntu VM (local connection).
# ansible_python_interpreter: run the modules with the system Python, the one pip3 installed ansible-core and the
# Docker SDK for (docs/INFRASTRUCTURE_SETUP.md, section 1). Left to discovery, ansible-core 2.17 takes the first
# python3.12 on PATH: the app venv's when it is active, else deadsnakes' /usr/bin/python3.12, under which the pip
# module stopped on the original VM (gap 16).
[platform]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
