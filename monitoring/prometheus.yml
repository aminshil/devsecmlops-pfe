global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["localhost:9100"]
        labels:
          machine: "pfe-vm"
          type: "web"

  - job_name: "fleet-simulator"
    scrape_interval: 30s
    static_configs:
      - targets: ["localhost:9200"]

  - job_name: "anomaly-bridge"
    scrape_interval: 30s
    static_configs:
      - targets: ["localhost:9300"]

  - job_name: "k8s-exporter"
    scrape_interval: 30s
    static_configs:
      - targets: ["localhost:9400"]
