# promtool unit tests for alert_rules.yml: every alert fires in its scenario and stays silent otherwise.
# Run: promtool test rules monitoring/alerting/alert_rules_test.yml   (scripts/check_alerting.sh does it)
rule_files:
  - alert_rules.yml
evaluation_interval: 5s
tests:
  - name: anomaly alerts use the freshest replica and ignore silent machines
    interval: 1m
    input_series:
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="web-01",machine_type="web"}'
        values: '1x20'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="web-01"}'
        values: '0+60x20'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="db-02",machine_type="db"}'
        values: '0x20'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="db-02"}'
        values: '0+60x20'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="app-03",machine_type="app"}'
        values: '1x20'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="app-03"}'
        values: '0x20'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p2",machine="app-03",machine_type="app"}'
        values: '0x20'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p2",machine="app-03"}'
        values: '30+60x20'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="cache-04",machine_type="cache"}'
        values: '1x20'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="cache-04"}'
        values: '0x20'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="edge-05",machine_type="edge"}'
        values: '0x4 1x16'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="edge-05"}'
        values: '0+60x20'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="cdn-06",machine_type="edge"}'
        values: '1 0 1 0 1 0x15'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="cdn-06"}'
        values: '0+60x20'
    alert_rule_test:
      # first anomalous verdict: alerted at once
      - eval_time: 10s
        alertname: AnomalyDetected
        exp_alerts:
          - exp_labels:
              severity: info
              list: anomalies
              machine: web-01
              machine_type: web
            exp_annotations:
              summary: "web-01 (web) is anomalous"
              description: "The served model flagged web-01 on its last readings."
          - exp_labels:
              severity: info
              list: anomalies
              machine: cache-04
              machine_type: cache
            exp_annotations:
              summary: "cache-04 (cache) is anomalous"
              description: "The served model flagged cache-04 on its last readings."
          - exp_labels:
              severity: info
              list: anomalies
              machine: cdn-06
              machine_type: edge
            exp_annotations:
              summary: "cdn-06 (edge) is anomalous"
              description: "The served model flagged cdn-06 on its last readings."
      # cdn-06 normal again: off the list at once
      - eval_time: 1m30s
        alertname: AnomalyDetected
        exp_alerts:
          - exp_labels:
              severity: info
              list: anomalies
              machine: web-01
              machine_type: web
            exp_annotations:
              summary: "web-01 (web) is anomalous"
              description: "The served model flagged web-01 on its last readings."
          - exp_labels:
              severity: info
              list: anomalies
              machine: cache-04
              machine_type: cache
            exp_annotations:
              summary: "cache-04 (cache) is anomalous"
              description: "The served model flagged cache-04 on its last readings."
      # cdn-06 anomalous again: back on the list
      - eval_time: 2m30s
        alertname: AnomalyDetected
        exp_alerts:
          - exp_labels:
              severity: info
              list: anomalies
              machine: web-01
              machine_type: web
            exp_annotations:
              summary: "web-01 (web) is anomalous"
              description: "The served model flagged web-01 on its last readings."
          - exp_labels:
              severity: info
              list: anomalies
              machine: cache-04
              machine_type: cache
            exp_annotations:
              summary: "cache-04 (cache) is anomalous"
              description: "The served model flagged cache-04 on its last readings."
          - exp_labels:
              severity: info
              list: anomalies
              machine: cdn-06
              machine_type: edge
            exp_annotations:
              summary: "cdn-06 (edge) is anomalous"
              description: "The served model flagged cdn-06 on its last readings."
      - eval_time: 3m30s
        alertname: AnomalyDetected
        exp_alerts:
          - exp_labels:
              severity: info
              list: anomalies
              machine: web-01
              machine_type: web
            exp_annotations:
              summary: "web-01 (web) is anomalous"
              description: "The served model flagged web-01 on its last readings."
          - exp_labels:
              severity: info
              list: anomalies
              machine: cache-04
              machine_type: cache
            exp_annotations:
              summary: "cache-04 (cache) is anomalous"
              description: "The served model flagged cache-04 on its last readings."
      # cache-04 silent for 5 minutes: dropped; edge-05 turned anomalous at 4m
      - eval_time: 5m15s
        alertname: AnomalyDetected
        exp_alerts:
          - exp_labels:
              severity: info
              list: anomalies
              machine: web-01
              machine_type: web
            exp_annotations:
              summary: "web-01 (web) is anomalous"
              description: "The served model flagged web-01 on its last readings."
          - exp_labels:
              severity: info
              list: anomalies
              machine: edge-05
              machine_type: edge
            exp_annotations:
              summary: "edge-05 (edge) is anomalous"
              description: "The served model flagged edge-05 on its last readings."
      - eval_time: 11m
        alertname: AnomalyDetected
        exp_alerts:
          - exp_labels:
              severity: info
              list: anomalies
              machine: web-01
              machine_type: web
            exp_annotations:
              summary: "web-01 (web) is anomalous"
              description: "The served model flagged web-01 on its last readings."
          - exp_labels:
              severity: info
              list: anomalies
              machine: edge-05
              machine_type: edge
            exp_annotations:
              summary: "edge-05 (edge) is anomalous"
              description: "The served model flagged edge-05 on its last readings."
      - eval_time: 5m
        alertname: AnomalyPersistent
        exp_alerts: []
      - eval_time: 11m
        alertname: AnomalyPersistent
        exp_alerts:
          - exp_labels:
              severity: warning
              list: anomalies
              machine: web-01
              machine_type: web
            exp_annotations:
              summary: "web-01 (web) anomalous for 10+ minutes"
              description: "Persistent anomaly on web-01: check the machine (Review tab: Details)."
  - name: a jump from 5 to 25 anomalous machines is a surge
