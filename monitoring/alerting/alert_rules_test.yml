  - name: a layer that stops answering is down; one that answers is not
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-layers",layer="Jenkins",instance="http://localhost:8080/login"}'
        values: '1 1 0 0 0 0 0'
      - series: 'probe_success{job="blackbox-layers",layer="SonarQube",instance="http://localhost:9000/api/system/status"}'
        values: '1x6'
    alert_rule_test:
      - eval_time: 1m
        alertname: LayerDown
        exp_alerts: []
      - eval_time: 3m
        alertname: LayerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-layers
              layer: Jenkins
              instance: http://localhost:8080/login
            exp_annotations:
              summary: "Jenkins is down"
              description: "Jenkins did not answer http://localhost:8080/login for 10 seconds (two probes in a row)."
  - name: a host exporter that cannot be scraped is down
    interval: 1m
    input_series:
      - series: 'up{job="k8s-exporter",instance="localhost:9400"}'
        values: '1 0 0 0 0 0'
      - series: 'up{job="node-exporter",instance="localhost:9100"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: ScrapeTargetDown
        exp_alerts: []
      - eval_time: 2m
        alertname: ScrapeTargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: k8s-exporter
              instance: localhost:9400
            exp_annotations:
              summary: "k8s-exporter is down"
              description: "Prometheus could not scrape k8s-exporter (localhost:9400) for 30 seconds."
  - name: the blackbox exporter itself down is reported
    interval: 1m
    input_series:
      - series: 'up{job="blackbox-layers",instance="http://localhost:5000/v2/",layer="Docker registry"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 5s
        alertname: BlackboxExporterDown
        exp_alerts: []
      - eval_time: 30s
        alertname: BlackboxExporterDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-layers
              instance: http://localhost:5000/v2/
              layer: Docker registry
            exp_annotations:
              summary: "blackbox exporter is down: layer checks are blind"
              description: "Prometheus cannot reach the blackbox exporter on :9115."
  - name: a serving pod that stops answering /metrics
    interval: 1m
    input_series:
      - series: 'up{job="anomaly-api-pods",pod="anomaly-api-7f",instance="192.168.49.2:8443"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 20s
        alertname: ServingPodNotScraped
        exp_alerts: []
      - eval_time: 1m
        alertname: ServingPodNotScraped
        exp_alerts:
          - exp_labels:
              severity: critical
              job: anomaly-api-pods
              pod: anomaly-api-7f
              instance: 192.168.49.2:8443
            exp_annotations:
              summary: "serving pod anomaly-api-7f is not answering /metrics"
              description: "Prometheus could not scrape pod anomaly-api-7f for 30 seconds."
  - name: fewer available replicas than desired
    interval: 1m
    input_series:
      - series: 'k8s_deployment_replicas_available{job="k8s-exporter",deployment="anomaly-api"}'
        values: '1x8'
      - series: 'k8s_deployment_replicas_desired{job="k8s-exporter",deployment="anomaly-api"}'
        values: '2x8'
    alert_rule_test:
      - eval_time: 1m
        alertname: ServingReplicasMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: ServingReplicasMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: k8s-exporter
              deployment: anomaly-api
            exp_annotations:
              summary: "anomaly-api has 1 available replicas, fewer than desired"
              description: "Some serving replicas have been unavailable for 2 minutes (longer than a rollout)."
  - name: a pod that is not Ready
    interval: 1m
    input_series:
      - series: 'k8s_pod_ready{job="k8s-exporter",namespace="ml-serving",pod="postgres-0"}'
        values: '0x6'
    alert_rule_test:
      - eval_time: 1m
        alertname: PodNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: PodNotReady
        exp_alerts:
          - exp_labels:
              severity: critical
              job: k8s-exporter
              namespace: ml-serving
              pod: postgres-0
            exp_annotations:
              summary: "pod postgres-0 is not Ready"
              description: "Pod postgres-0 in ml-serving has not been Ready for 2 minutes (longer than a rollout)."
  - name: the Kubernetes API not answering
    interval: 1m
    input_series:
      - series: 'k8s_exporter_up{job="k8s-exporter",instance="localhost:9400"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 20s
        alertname: KubernetesUnreachable
        exp_alerts: []
      - eval_time: 1m
        alertname: KubernetesUnreachable
        exp_alerts:
          - exp_labels:
              severity: critical
              job: k8s-exporter
              instance: localhost:9400
            exp_annotations:
              summary: "the Kubernetes API is not answering"
              description: "kubectl calls from the k8s exporter have failed for 30 seconds (Minikube down?)."
  - name: no predictions for a minute
    # several predictions every 5 s until 2m, then none: the last increase leaves the 1-minute window at
    # 3m, and the alert fires 15 s later
    interval: 5s
    input_series:
      - series: 'api_predictions_total{job="anomaly-api-pods",pod="p1",model="telecom_v4_rolling",machine_type="web",is_anomaly="0",likely_cause="normal"}'
        values: '0+30x24 720x60'
    alert_rule_test:
      - eval_time: 2m30s
        alertname: PredictionsStopped
        exp_alerts: []
      - eval_time: 3m10s
        alertname: PredictionsStopped
        exp_alerts: []
      - eval_time: 3m20s
        alertname: PredictionsStopped
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "no predictions served for a minute"
              description: "The traffic agent or the serving path has stopped."
  - name: root disk above 90%
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",instance="localhost:9100"}'
        values: '5x8'
      - series: 'node_filesystem_size_bytes{job="node-exporter",mountpoint="/",instance="localhost:9100"}'
        values: '100x8'
    alert_rule_test:
      - eval_time: 4m
        alertname: DiskAlmostFull
        exp_alerts: []
      - eval_time: 6m
        alertname: DiskAlmostFull
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              mountpoint: /
              instance: localhost:9100
            exp_annotations:
              summary: "root disk above 90% full"
              description: "Free space on / is 5%; SonarQube goes read-only at 95%."
  - name: less than 1.5 GB of memory available
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="node-exporter",instance="localhost:9100"}'
        values: '1e9x8'
    alert_rule_test:
      - eval_time: 4m
        alertname: MemoryLow
        exp_alerts: []
      - eval_time: 6m
        alertname: MemoryLow
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              instance: localhost:9100
            exp_annotations:
              summary: "less than 1.5 GB of memory available"
              description: "Available memory is 953.7MiB; training needs about 11 GB."
  - name: a layer down is alerted within 25 seconds, and a single failed probe is not
    interval: 5s
    input_series:
      - series: 'probe_success{job="blackbox-layers",layer="Grafana",instance="http://localhost:3000/api/health"}'
        values: '1 1 0x20'
      - series: 'probe_success{job="blackbox-layers",layer="MLflow",instance="http://localhost:5001/health"}'
        values: '1 1 0 1x18'
    alert_rule_test:
      - eval_time: 15s
        alertname: LayerDown
        exp_alerts: []
      - eval_time: 25s
        alertname: LayerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-layers
              layer: Grafana
              instance: http://localhost:3000/api/health
            exp_annotations:
              summary: "Grafana is down"
              description: "Grafana did not answer http://localhost:3000/api/health for 10 seconds (two probes in a row)."

  - name: the Grafana list and count show the same machines as the Telegram list
    # web-01 anomalous throughout; db-01 normal for the last minute; db-02 always normal; edge-01 stopped
    # reporting 6 minutes ago while anomalous (it reported every 15 s: missed its reports after 45 s); app-01
    # has not reported for 10 minutes, after a single report (its interval is not known: listed as not
    # reporting only after 15 minutes). Only web-01 is anomalous now, in all three; edge-01 is the one
    # machine not reporting. The expressions are the dashboard's, with $machine_type = .*
    # (tests/test_alerting.py checks they are copied verbatim).
    interval: 15s
    input_series:
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="web-01",machine_type="web"}'
        values: '1x40'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="web-01",machine_type="web"}'
        values: '0+15x40'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="db-01",machine_type="db"}'
        values: '1x36 0x4'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="db-01",machine_type="db"}'
        values: '0+15x40'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="db-02",machine_type="db"}'
        values: '0x40'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="db-02",machine_type="db"}'
        values: '0+15x40'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="edge-01",machine_type="edge"}'
        values: '1x40'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="edge-01",machine_type="edge"}'
        values: '0+15x16 240x24'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="app-01",machine_type="app"}'
        values: '1x40'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="app-01",machine_type="app"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: AnomalyDetected
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: web-01, machine_type: web}
            exp_annotations: {summary: "web-01 (web) is anomalous", description: "The served model flagged web-01 on its last readings."}
    promql_expr_test:
      - expr: "(fleet:machine_anomalous:fresh{machine_type=~\".*\"} unless on (machine) (fleet:machine_silent == 1)) == 1"
        eval_time: 10m
        exp_samples:
          - {labels: 'fleet:machine_anomalous:fresh{machine="web-01",machine_type="web"}', value: 1}
      - expr: "count((fleet:machine_anomalous:fresh{machine_type=~\".*\"} unless on (machine) (fleet:machine_silent == 1)) == 1) or vector(0)"
        eval_time: 10m
        exp_samples:
          - {labels: '{}', value: 1}
      - expr: "count(fleet:machine_silent{machine_type=~\".*\"} == 1) or vector(0)"
        eval_time: 10m
        exp_samples:
          - {labels: '{}', value: 1}
      - expr: "fleet:machine_silence:seconds{machine_type=~\".*\"} > fleet:machine_silence:limit_seconds"
        eval_time: 10m
        exp_samples:
          - {labels: 'fleet:machine_silence:seconds{machine="edge-01",machine_type="edge"}', value: 360}
      # edge-01 was still on the list until it missed its reports (last report at 4m, limit 45 s); app-01
      # until its verdict was 5 minutes old
      - expr: "(fleet:machine_anomalous:fresh{machine_type=~\".*\"} unless on (machine) (fleet:machine_silent == 1)) == 1"
        eval_time: 4m45s
        exp_samples:
          - {labels: 'fleet:machine_anomalous:fresh{machine="web-01",machine_type="web"}', value: 1}
          - {labels: 'fleet:machine_anomalous:fresh{machine="db-01",machine_type="db"}', value: 1}
          - {labels: 'fleet:machine_anomalous:fresh{machine="edge-01",machine_type="edge"}', value: 1}
          - {labels: 'fleet:machine_anomalous:fresh{machine="app-01",machine_type="app"}', value: 1}
      - expr: "(fleet:machine_anomalous:fresh{machine_type=~\".*\"} unless on (machine) (fleet:machine_silent == 1)) == 1"
        eval_time: 4m50s
        exp_samples:
          - {labels: 'fleet:machine_anomalous:fresh{machine="web-01",machine_type="web"}', value: 1}
          - {labels: 'fleet:machine_anomalous:fresh{machine="db-01",machine_type="db"}', value: 1}
          - {labels: 'fleet:machine_anomalous:fresh{machine="app-01",machine_type="app"}', value: 1}
      # the control panel's History tab (api/app.py, _HISTORY_EXPR): the same machines, from the raw metrics
      - expr: "(max by (machine, machine_type) (api_currently_anomalous{job=\"anomaly-api-pods\"} and on (pod, machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"} == on (machine) group_left () max by (machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"}))) and on (machine) (time() - max by (machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"}) < 300)) == 1"
        eval_time: 10m
        exp_samples:
          - {labels: '{machine="web-01",machine_type="web"}', value: 1}
      - expr: "(max by (machine, machine_type) (api_currently_anomalous{job=\"anomaly-api-pods\"} and on (pod, machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"} == on (machine) group_left () max by (machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"}))) and on (machine) (time() - max by (machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"}) < 300)) == 1"
        eval_time: 9m
        exp_samples:
          - {labels: '{machine="web-01",machine_type="web"}', value: 1}
          - {labels: '{machine="db-01",machine_type="db"}', value: 1}

  - name: the dashboard counts only machines that reported in the last 5 minutes, and lists the firing alerts
    # web-01 reports and is anomalous (cpu 90, P(anomaly) 0.95); db-02 stopped reporting long ago with cpu 10 and
    # P(anomaly) 0.99 still exported. The expressions are the dashboard's, with $machine_type = .*
    # (tests/test_alerting.py checks they are copied verbatim).
    interval: 15s
    input_series:
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="web-01",machine_type="web"}'
        values: '1x20'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="web-01"}'
        values: '0+15x20'
      - series: 'api_input_metric{job="anomaly-api-pods",pod="p1",machine="web-01",machine_type="web",feature="cpu"}'
        values: '90x20'
      - series: 'api_classifier_p_anomaly{job="anomaly-api-pods",pod="p1",machine="web-01",machine_type="web"}'
        values: '0.95x20'
      - series: 'api_anomaly_cause_p{job="anomaly-api-pods",pod="p1",machine="web-01",machine_type="web",cause="cpu_spike"}'
        values: '0.95x20'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="db-02",machine_type="db"}'
        values: '1x20'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="db-02"}'
        values: '-1000x20'
      - series: 'api_input_metric{job="anomaly-api-pods",pod="p1",machine="db-02",machine_type="db",feature="cpu"}'
        values: '10x20'
      - series: 'api_classifier_p_anomaly{job="anomaly-api-pods",pod="p1",machine="db-02",machine_type="db"}'
        values: '0.99x20'
      - series: 'api_predictions_total{job="anomaly-api-pods",pod="p1",model="telecom_v4_rolling"}'
        values: '0+30x20'
    promql_expr_test:
      - expr: "avg((api_input_metric{job=\"anomaly-api-pods\",feature=\"cpu\",machine_type=~\".*\"} and on(pod, machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"} == on(machine) group_left() max by (machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"}))) and on(machine) (time() - max by (machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"}) < 300))"
        eval_time: 4m
        exp_samples:
          - {labels: '{}', value: 90}
      - expr: "sort_desc(topk(25, (max by (machine, cause) (api_anomaly_cause_p{job=\"anomaly-api-pods\",machine_type=~\".*\"} and on(pod, machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"} == on(machine) group_left() max by (machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"}))) and on(machine) (time() - max by (machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"}) < 300)) or on(machine) label_replace((max by (machine) (api_classifier_p_anomaly{job=\"anomaly-api-pods\",machine_type=~\".*\"} and on(pod, machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"} == on(machine) group_left() max by (machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"}))) and on(machine) (time() - max by (machine) (api_machine_last_seen_timestamp_seconds{job=\"anomaly-api-pods\"}) < 300)), \"cause\", \"normal\", \"\", \"\")))"
        eval_time: 4m
        exp_samples:
          - {labels: '{machine="web-01",cause="cpu_spike"}', value: 0.95}
      - expr: "count by (alertname, severity) (ALERTS{alertstate=\"firing\"})"
        eval_time: 4m
        exp_samples:
          - {labels: '{alertname="AnomalyDetected",severity="info"}', value: 1}
          - {labels: '{alertname="MachineSilent",severity="info"}', value: 1}

  - name: the root-cause spotlight shows only routers named in the last 5 minutes, the chart when
    # one check every 20 s (the production agent). router-03 was named in the first 2 minutes only (6 checks);
    # router-08 in every check of the last 5 minutes: 15 checks, 14 steps between them, so 14 is the most. The expressions are the dashboard's
    # (tests/test_alerting.py checks they are copied verbatim).
    interval: 20s
    input_series:
      - series: 'api_root_cause_incidents_total{job="anomaly-api-pods",pod="p1",machine="router-03"}'
        values: '0+1x6 6x24'
      - series: 'api_root_cause_incidents_total{job="anomaly-api-pods",pod="p1",machine="router-08"}'
        values: '0x15 0+1x15'
    promql_expr_test:
      - expr: "round(sum by (machine) (increase(api_root_cause_incidents_total{job=\"anomaly-api-pods\"}[5m])) > 0)"
        eval_time: 10m
        exp_samples:
          - {labels: '{machine="router-08"}', value: 14}
      - expr: "sum by (machine) (increase(api_root_cause_incidents_total{job=\"anomaly-api-pods\"}[1m]))"
        eval_time: 10m
        exp_samples:
          - {labels: '{machine="router-03"}', value: 0}
          - {labels: '{machine="router-08"}', value: 3}
      - expr: "sum by (machine) (increase(api_root_cause_incidents_total{job=\"anomaly-api-pods\"}[1m]))"
        eval_time: 1m
        exp_samples:
          - {labels: '{machine="router-03"}', value: 3}
          - {labels: '{machine="router-08"}', value: 0}

  - name: a machine that clears is announced once as back to normal; one that stops reporting is not
    # m-clear: anomalous for 2 minutes, then normal (reports every 15 s). m-stale: anomalous, reports every
    # 15 s and stops at 1 minute: it misses its reports after 45 s (three intervals), at 1m45s.
    interval: 15s
    input_series:
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="m-clear",machine_type="web"}'
        values: '1x7 0x40'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="m-clear"}'
        values: '0+15x47'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="m-stale",machine_type="db"}'
        values: '1x47'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="m-stale"}'
        values: '0+15x4 60x42'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: AnomalyDetected
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: m-clear, machine_type: web}
            exp_annotations: {summary: "m-clear (web) is anomalous", description: "The served model flagged m-clear on its last readings."}
          - exp_labels: {severity: info, list: anomalies, machine: m-stale, machine_type: db}
            exp_annotations: {summary: "m-stale (db) is anomalous", description: "The served model flagged m-stale on its last readings."}
      - eval_time: 1m45s
        alertname: AnomalyCleared
        exp_alerts: []
      # m-stale missed its reports: off the anomalous list, listed as not reporting with its last verdict;
      # it is not "back to normal"
      - eval_time: 1m50s
        alertname: AnomalyDetected
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: m-clear, machine_type: web}
            exp_annotations: {summary: "m-clear (web) is anomalous", description: "The served model flagged m-clear on its last readings."}
      - eval_time: 1m50s
        alertname: MachineSilent
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: m-stale, machine_type: db}
            exp_annotations:
              summary: "m-stale (db) stopped reporting"
              silence: "50s"
              usual: "15s"
              last_verdict: "anomalous"
              description: "No report from m-stale for 50s: it has missed its reports."
      # m-clear turned normal at 2m: announced for one minute
      - eval_time: 2m30s
        alertname: AnomalyCleared
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: m-clear, machine_type: web}
            exp_annotations: {summary: "m-clear (web) is back to normal", description: "The served model's latest verdict on m-clear is normal again."}
      - eval_time: 3m30s
        alertname: AnomalyCleared
        exp_alerts: []
      - eval_time: 6m30s
        alertname: AnomalyCleared
        exp_alerts: []
      - eval_time: 6m30s
        alertname: AnomalyDetected
        exp_alerts: []
      - eval_time: 6m30s
        alertname: FleetNoData
        exp_alerts: []

  - name: no machine reporting on time is "no information", not "all clear"; the first report ends it
    # web-01 reports every 15 s, stops at 1m (misses its reports after 45 s, at 1m45s) and reports again at 5m
    interval: 15s
    input_series:
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="web-01",machine_type="web"}'
        values: '0x40'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="web-01"}'
        values: '0+15x4 60x14 300+15x20'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: FleetNoData
        exp_alerts: []
      - eval_time: 1m50s
        alertname: FleetNoData
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies}
            exp_annotations: {summary: "no information about the machines", description: "No machine is reporting to the serving pods: every one has missed its reports."}
      - eval_time: 4m55s
        alertname: FleetNoData
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies}
            exp_annotations: {summary: "no information about the machines", description: "No machine is reporting to the serving pods: every one has missed its reports."}
      - eval_time: 4m55s
        alertname: MachineReportingAgain
        exp_alerts: []
      - eval_time: 5m
        alertname: FleetNoData
        exp_alerts: []
      - eval_time: 5m
        alertname: MachineReportingAgain
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: web-01, machine_type: web}
            exp_annotations: {summary: "web-01 (web) is reporting", description: "web-01 reports on time (after missing its reports, or for the first time)."}
      - eval_time: 6m
        alertname: MachineReportingAgain
        exp_alerts: []

  - name: each machine is judged on its own rhythm, and a pause does not stretch it
    # m30 reports every 30 s and stops at 20m (anomalous): limit 90 s. m60 every 60 s, stops at 20m: limit 180 s.
    # mnew reported twice (0 and 30 s): its interval is not known, so 15 minutes. mpause reports every 30 s,
    # pauses from 10m to 15m, resumes, and stops at 25m: missed at 1m30s + 5 s both times (the pause does not
    # raise its limit). FleetNoData once the last of them (mpause) has missed its reports.
    interval: 30s
    input_series:
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="m30",machine_type="web"}'
        values: '1x64'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="m30"}'
        values: '0+30x40 1200x23'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="m60",machine_type="db"}'
        values: '0x64'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="m60"}'
        values: '0 0 60 60 120 120 180 180 240 240 300 300 360 360 420 420 480 480 540 540 600 600 660 660 720 720 780 780 840 840 900 900 960 960 1020 1020 1080 1080 1140 1140 1200 1200x23'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="mnew",machine_type="app"}'
        values: '0x64'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="mnew"}'
        values: '0 30x63'
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="mpause",machine_type="edge"}'
        values: '0x64'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="mpause"}'
        values: '0+30x20 600x8 900+30x20 1500x13'
    alert_rule_test:
      # the first minute: each machine announced as reporting (first report)
      - eval_time: 30s
        alertname: MachineReportingAgain
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: m30, machine_type: web}
            exp_annotations: {summary: "m30 (web) is reporting", description: "m30 reports on time (after missing its reports, or for the first time)."}
          - exp_labels: {severity: info, list: anomalies, machine: m60, machine_type: db}
            exp_annotations: {summary: "m60 (db) is reporting", description: "m60 reports on time (after missing its reports, or for the first time)."}
          - exp_labels: {severity: info, list: anomalies, machine: mnew, machine_type: app}
            exp_annotations: {summary: "mnew (app) is reporting", description: "mnew reports on time (after missing its reports, or for the first time)."}
          - exp_labels: {severity: info, list: anomalies, machine: mpause, machine_type: edge}
            exp_annotations: {summary: "mpause (edge) is reporting", description: "mpause reports on time (after missing its reports, or for the first time)."}
      - eval_time: 1m30s
        alertname: MachineReportingAgain
        exp_alerts: []
      # mpause pauses at 10m: missed after 90 s
      - eval_time: 11m25s
        alertname: MachineSilent
        exp_alerts: []
      - eval_time: 11m35s
        alertname: MachineSilent
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: mpause, machine_type: edge}
            exp_annotations:
              summary: "mpause (edge) stopped reporting"
              silence: "1m 35s"
              usual: "30s"
              last_verdict: "normal"
              description: "No report from mpause for 1m 35s: it has missed its reports."
      # mpause reports again at 15m: announced for one minute
      - eval_time: 15m
        alertname: MachineReportingAgain
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: mpause, machine_type: edge}
            exp_annotations: {summary: "mpause (edge) is reporting", description: "mpause reports on time (after missing its reports, or for the first time)."}
      - eval_time: 15m
        alertname: MachineSilent
        exp_alerts: []
      - eval_time: 16m
        alertname: MachineReportingAgain
        exp_alerts: []
      # mnew: 15 minutes after its last report (its interval is not known)
      - eval_time: 15m30s
        alertname: MachineSilent
        exp_alerts: []
      - eval_time: 15m35s
        alertname: MachineSilent
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: mnew, machine_type: app}
            exp_annotations:
              summary: "mnew (app) stopped reporting"
              silence: "15m 5s"
              usual: ""
              last_verdict: "normal"
              description: "No report from mnew for 15m 5s: it has missed its reports."
      # m30 stops at 20m while anomalous: listed as not reporting with its last verdict, off the anomalous list,
      # and not announced as back to normal
      - eval_time: 21m25s
        alertname: AnomalyDetected
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: m30, machine_type: web}
            exp_annotations: {summary: "m30 (web) is anomalous", description: "The served model flagged m30 on its last readings."}
      - eval_time: 21m35s
        alertname: AnomalyDetected
        exp_alerts: []
      - eval_time: 21m35s
        alertname: AnomalyCleared
        exp_alerts: []
      - eval_time: 21m35s
        alertname: MachineSilent
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: m30, machine_type: web}
            exp_annotations:
              summary: "m30 (web) stopped reporting"
              silence: "1m 35s"
              usual: "30s"
              last_verdict: "anomalous"
              description: "No report from m30 for 1m 35s: it has missed its reports."
          - exp_labels: {severity: info, list: anomalies, machine: mnew, machine_type: app}
            exp_annotations:
              summary: "mnew (app) stopped reporting"
              silence: "21m 5s"
              usual: ""
              last_verdict: "normal"
              description: "No report from mnew for 21m 5s: it has missed its reports."
      # m60 stops at 20m too, but its limit is 180 s
      - eval_time: 22m55s
        alertname: MachineSilent
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: m30, machine_type: web}
            exp_annotations:
              summary: "m30 (web) stopped reporting"
              silence: "2m 55s"
              usual: "30s"
              last_verdict: "anomalous"
              description: "No report from m30 for 2m 55s: it has missed its reports."
          - exp_labels: {severity: info, list: anomalies, machine: mnew, machine_type: app}
            exp_annotations:
              summary: "mnew (app) stopped reporting"
              silence: "22m 25s"
              usual: ""
              last_verdict: "normal"
              description: "No report from mnew for 22m 25s: it has missed its reports."
      - eval_time: 23m5s
        alertname: MachineSilent
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: m30, machine_type: web}
            exp_annotations:
              summary: "m30 (web) stopped reporting"
              silence: "3m 5s"
              usual: "30s"
              last_verdict: "anomalous"
              description: "No report from m30 for 3m 5s: it has missed its reports."
          - exp_labels: {severity: info, list: anomalies, machine: m60, machine_type: db}
            exp_annotations:
              summary: "m60 (db) stopped reporting"
              silence: "3m 5s"
              usual: "1m 0s"
              last_verdict: "normal"
              description: "No report from m60 for 3m 5s: it has missed its reports."
          - exp_labels: {severity: info, list: anomalies, machine: mnew, machine_type: app}
            exp_annotations:
              summary: "mnew (app) stopped reporting"
              silence: "22m 35s"
              usual: ""
              last_verdict: "normal"
              description: "No report from mnew for 22m 35s: it has missed its reports."
      # mpause stops at 25m: same 90 s limit as before its pause; then no machine reports
      - eval_time: 26m25s
        alertname: FleetNoData
        exp_alerts: []
      - eval_time: 26m35s
        alertname: FleetNoData
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies}
            exp_annotations: {summary: "no information about the machines", description: "No machine is reporting to the serving pods: every one has missed its reports."}

  - name: a machine that reports every 5 s is given at least 30 s (the scrape and the evaluation take up to 10 s)
    interval: 5s
    input_series:
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="m5",machine_type="web"}'
        values: '0x48'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="m5"}'
        values: '0+5x24 120x23'
    alert_rule_test:
      - eval_time: 2m30s
        alertname: MachineSilent
        exp_alerts: []
      - eval_time: 2m35s
        alertname: MachineSilent
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: m5, machine_type: web}
            exp_annotations:
              summary: "m5 (web) stopped reporting"
              silence: "35s"
              usual: "5s"
              last_verdict: "normal"
              description: "No report from m5 for 35s: it has missed its reports."

  - name: a machine that restarts after a long stop is judged on its new reports at once
    # The pods still remember a report from an hour ago; the agent starts at 10m (every 30 s) and stops again
    # at 13m. Its usual interval is 30 s from its third gap (the hour-long gap does not count for more than
    # one), so it misses its reports at 13m + 90 s. On the VM on 26 October, the first estimator (an average
    # over 15-minute windows) put that machine's interval at about 15 minutes and never listed it. At 5m it
    # has no verdict younger than 5 minutes, so its last verdict is empty.
    interval: 30s
    input_series:
      - series: 'api_currently_anomalous{job="anomaly-api-pods",pod="p1",machine="m-restart",machine_type="web"}'
        values: '0x40'
      - series: 'api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods",pod="p1",machine="m-restart"}'
        values: '-3600x19 600+30x6 780x13'
    alert_rule_test:
      - eval_time: 5m
        alertname: MachineSilent
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: m-restart, machine_type: web}
            exp_annotations:
              summary: "m-restart (web) stopped reporting"
              silence: "1h 5m 0s"
              usual: ""
              last_verdict: ""
              description: "No report from m-restart for 1h 5m 0s: it has missed its reports."
      - eval_time: 10m30s
        alertname: MachineReportingAgain
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: m-restart, machine_type: web}
            exp_annotations: {summary: "m-restart (web) is reporting", description: "m-restart reports on time (after missing its reports, or for the first time)."}
      - eval_time: 14m25s
        alertname: MachineSilent
        exp_alerts: []
      - eval_time: 14m35s
        alertname: MachineSilent
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies, machine: m-restart, machine_type: web}
            exp_annotations:
              summary: "m-restart (web) stopped reporting"
              silence: "1m 35s"
              usual: "30s"
              last_verdict: "normal"
              description: "No report from m-restart for 1m 35s: it has missed its reports."
      - eval_time: 14m35s
        alertname: FleetNoData
        exp_alerts:
          - exp_labels: {severity: info, list: anomalies}
            exp_annotations: {summary: "no information about the machines", description: "No machine is reporting to the serving pods: every one has missed its reports."}
