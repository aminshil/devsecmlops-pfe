# Alert rules for the DevSecMLOps platform. Prometheus evaluates them every 5 s; Alertmanager groups
# and delivers the alerts (Telegram). Unit-tested by promtool (alert_rules_test.yml), run by
# scripts/check_alerting.sh and by scripts/setup_alerting.sh before anything is installed.
#
# Freshness: each serving replica only knows the machines IT served, and its gauge keeps the last
# value. So, as in the control panel's Fleet tab (api/app.py, _freshest), a machine's state is taken
# from the replica that saw it last, and only for machines that reported in the last 5 minutes.
#
# Missed reports: every machine reports on its own rhythm (the production agent: about every 30 s). Its
# usual interval is measured from its own reports, and a machine silent for more than three of them has
# missed its reports: it is listed as not reporting (MachineSilent), and its last verdict no longer counts
# as current. The alerts that make up the Telegram anomaly list carry the label list="anomalies"
# (alertmanager.yml.tmpl routes on it; the control panel's "mute the anomaly list" silences it).
#
# Confirmed anomalies only: the Telegram list names the machines the classifier flagged. A machine flagged
# by the IsolationForest safety net alone is still anomalous (the served decision, the panel and Grafana's
# counts are unchanged), but it is not sent: measured on 27 October, 16.9% of those alarms were real, live
# (1,683 of 9,967), against 88.8% for the classifier's (README, "Safety-net alarms"). Their real hits are
# cascades, which reach Telegram through FleetAnomalySurge (many machines at once), which counts all of them.

groups:
  - name: anomalies
    rules:
      - record: fleet:machine_anomalous:fresh
        # 1 or 0 per machine: the latest verdict, from the replica that served the machine last (if two
        # replicas saw it at the very same instant, max keeps 'anomalous': the safer side)
        expr: |
          max by (machine, machine_type) (
            api_currently_anomalous{job="anomaly-api-pods"}
            and on (pod, machine)
            (api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods"}
              == on (machine) group_left ()
              max by (machine) (api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods"}))
          )
          and on (machine)
          (time() - max by (machine) (api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods"}) < 300)

      # ---- is each machine still reporting? ----
      - record: fleet:machine_last_seen:max
        # when the machine last reported, whichever replica served it (its type taken from the verdict gauge,
        # which the API sets on the same request)
        expr: |
          max by (machine) (api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods"})
          + on (machine) group_left (machine_type)
          (0 * topk by (machine) (1, max by (machine, machine_type) (api_currently_anomalous{job="anomaly-api-pods"})))

      - record: fleet:machine_report_gap:seconds
        # the time between two of its reports, recorded when a report arrives (its last-seen time moved since
        # the previous evaluation): one sample per report
        expr: (fleet:machine_last_seen:max - fleet:machine_last_seen:max offset 5s) > 0

      - record: fleet:machine_report_interval:usual
        # its usual interval: the median of its gaps over the last hour (once it has 3), so one long gap, such
        # as the traffic agent stopped for an hour and started again, does not change it. (An average over a
        # window did: after a long stop it stayed inflated for 15 minutes, and a machine that stopped again
        # in that time was never listed; seen on the VM on 26 October.)
        expr: |
          quantile_over_time(0.5, fleet:machine_report_gap:seconds[1h])
          and count_over_time(fleet:machine_report_gap:seconds[1h]) >= 3

      - record: fleet:machine_silence:seconds
        # seconds since its last report (machines that reported in the last hour, or that a pod still remembers)
        expr: time() - max_over_time(fleet:machine_last_seen:max[1h])

      - record: fleet:machine_silence:limit_seconds
        # how long it may stay silent: three usual intervals (at least 30 s, for the 5 s scrape and evaluation);
        # 15 minutes while its usual interval is not known yet (fewer than 3 gaps seen in the last hour)
        expr: |
          clamp_min(3 * fleet:machine_report_interval:usual, 30)
          or (0 * fleet:machine_silence:seconds + 900)

      - record: fleet:machine_silent
        # 1 when it has missed its reports (silent longer than its limit), 0 while it reports on time
        expr: fleet:machine_silence:seconds > bool fleet:machine_silence:limit_seconds

      - record: fleet:machine_anomalous:now
        # the verdict that is current: the fresh verdict of a machine that has not missed its reports. The
        # Telegram list and Grafana's "now" panels read this.
        expr: fleet:machine_anomalous:fresh unless on (machine) (fleet:machine_silent == 1)

      - record: fleet:anomalous_machines:count
        # every anomalous machine, safety-net-only ones included: FleetAnomalySurge reads it
        expr: count(fleet:machine_anomalous:now == 1) or vector(0)

      # ---- which model flagged it ----
      - record: fleet:machine_net_only:fresh
        # 1 per machine whose latest anomalous verdict came from the IsolationForest safety net alone (the
        # classifier did not flag it). The API names that cause in api_anomaly_cause_p (api/app.py,
        # SAFETY_NET_CAUSE); read from the replica that served the machine last, as fleet:machine_anomalous:fresh
        expr: |
          group by (machine) (
            api_anomaly_cause_p{job="anomaly-api-pods", cause="unknown (flagged by safety-net model only)"}
            and on (pod, machine)
            (api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods"}
              == on (machine) group_left ()
              max by (machine) (api_machine_last_seen_timestamp_seconds{job="anomaly-api-pods"}))
          )

      - record: fleet:machine_confirmed:now
        # what the Telegram list reads: 1 when the machine is anomalous now and the classifier flagged it;
        # 0 when it is normal now or flagged by the safety net only (same machines as fleet:machine_anomalous:now)
        expr: |
          (fleet:machine_anomalous:now unless on (machine) fleet:machine_net_only:fresh)
          or (0 * fleet:machine_anomalous:now)

      - alert: AnomalyDetected
        # direct, both ways: fires on the first confirmed anomalous verdict and resolves on the first one that
        # is not (no hold), so the Telegram list is exactly the machines the classifier flags now; a verdict
        # that flickers (1, 0, 1, 0) comes and goes with it. Alertmanager sends the list within 5 s of a change.
        expr: fleet:machine_confirmed:now == 1
        labels:
          severity: info
          list: anomalies
        annotations:
          summary: "{{ $labels.machine }} ({{ $labels.machine_type }}) is anomalous"
          description: "The served model flagged {{ $labels.machine }} on its last readings."

      - alert: AnomalyCleared
        # the "back to normal" line of the Telegram list: fires for one minute after a machine leaves it. A
        # firing alert of its own (not Alertmanager's resolved alerts, which Prometheus keeps re-sending for
        # 15 minutes) so a clear is announced once. A machine that stops reporting has no current verdict
        # and is not announced as back to normal (MachineSilent lists it). `now` says why it left: "normal",
        # or "safety net only" (still anomalous, no longer confirmed by the classifier: its own ❔ line).
        expr: |
          (fleet:machine_confirmed:now == 0)
          and on (machine) (max_over_time(fleet:machine_confirmed:now[1m]) == 1)
        labels:
          severity: info
          list: anomalies
        annotations:
          now: '{{ with printf "fleet:machine_net_only:fresh{machine=%q}" $labels.machine | query }}safety net only{{ else }}normal{{ end }}'
          summary: '{{ $labels.machine }} ({{ $labels.machine_type }}) {{ with printf "fleet:machine_net_only:fresh{machine=%q}" $labels.machine | query }}is no longer confirmed by the classifier{{ else }}is back to normal{{ end }}'
          description: '{{ with printf "fleet:machine_net_only:fresh{machine=%q}" $labels.machine | query }}Only the IsolationForest safety net still flags {{ $labels.machine }}: not sent to Telegram (Review tab).{{ else }}The served model''s latest verdict on {{ $labels.machine }} is normal again.{{ end }}'

      - alert: MachineSilent
        # the machine missed its reports: nothing for more than three of its usual intervals. The value is the
        # silence in seconds; the annotations give its usual interval and its last verdict (rounded to the second).
        expr: fleet:machine_silence:seconds > fleet:machine_silence:limit_seconds
        labels:
          severity: info
          list: anomalies
        annotations:
          summary: "{{ $labels.machine }} ({{ $labels.machine_type }}) stopped reporting"
          silence: '{{ printf "%.0f" $value | humanizeDuration }}'
          usual: '{{ with printf "fleet:machine_report_interval:usual{machine=%q}" $labels.machine | query }}{{ . | first | value | printf "%.0f" | humanizeDuration }}{{ end }}'
          last_verdict: '{{ with printf "last_over_time(fleet:machine_anomalous:fresh{machine=%q}[1h])" $labels.machine | query }}{{ if eq (. | first | value) 1.0 }}anomalous{{ else }}normal{{ end }}{{ end }}'
          description: 'No report from {{ $labels.machine }} for {{ printf "%.0f" $value | humanizeDuration }}: it has missed its reports.'

      - alert: MachineReportingAgain
        # the "reporting again" line of the Telegram list: fires for one minute after a machine that had missed
        # its reports (or was not known a minute ago) reports on time
        expr: |
          (fleet:machine_silent == 0)
          and on (machine) (
            (max_over_time(fleet:machine_silent[1m]) == 1)
            or (fleet:machine_silent unless on (machine) (fleet:machine_silent offset 1m))
          )
        labels:
          severity: info
          list: anomalies
        annotations:
          summary: "{{ $labels.machine }} ({{ $labels.machine_type }}) is reporting"
          description: "{{ $labels.machine }} reports on time (after missing its reports, or for the first time)."

      - alert: FleetNoData
        # no machine reports on time (the traffic agent or the serving path stopped): the Telegram list says
        # "no information" instead of "all clear"
        expr: absent(fleet:machine_silent == 0)
        labels:
          severity: info
          list: anomalies
        annotations:
          summary: "no information about the machines"
          description: "No machine is reporting to the serving pods: every one has missed its reports."

      - alert: AnomalyPersistent
        # an episode, not a blip: anomalous on every reading for 10 minutes. Part of the list (marked ⏱ on the
        # machine's line, counted in the header), not a message of its own: as a separate message it was re-sent
        # every time a machine entered or left the 10-minute set, which the list already shows (26 October)
        expr: fleet:machine_confirmed:now == 1
        for: 10m
        labels:
          severity: warning
          list: anomalies
        annotations:
          summary: "{{ $labels.machine }} ({{ $labels.machine_type }}) anomalous for 10+ minutes"
          description: "Persistent anomaly on {{ $labels.machine }}: check the machine (Review tab: Details)."

      - alert: FleetAnomalySurge
        # many machines at once points upstream (a router, a shared dependency). Self-calibrating:
        # at least twice the 6-hour average AND at least 20 machines (10% of the fleet), for 2 minutes.
        # Counts safety-net-only machines too: a cascade is mostly caught by the safety net alone
        expr: |
          fleet:anomalous_machines:count >= 20
          and fleet:anomalous_machines:count > 2 * avg_over_time(fleet:anomalous_machines:count[6h])
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} machines anomalous at once (more than twice the usual level)"
          description: "A fleet-wide or router incident is likely: open the Fleet tab."

  - name: platform
    rules:
      - alert: LayerDown
        # HTTP probe of each platform layer every 5 s (prometheus.yml, blackbox-layers): fires on the second
        # failure in a row (10 s); a single slow answer does not page
        expr: probe_success{job="blackbox-layers"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.layer }} is down"
          description: "{{ $labels.layer }} did not answer {{ $labels.instance }} for 10 seconds (two probes in a row)."

      - alert: ScrapeTargetDown
        # the host exporters and the control panel, scraped directly by Prometheus
        expr: up{job=~"node-exporter|k8s-exporter|anomaly-api-host"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus could not scrape {{ $labels.job }} ({{ $labels.instance }}) for 30 seconds."

      - alert: BlackboxExporterDown
        # without it, LayerDown cannot fire: report it on its own
        expr: up{job="blackbox-layers"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "blackbox exporter is down: layer checks are blind"
          description: "Prometheus cannot reach the blackbox exporter on :9115."

      - alert: ServingPodNotScraped
        expr: up{job="anomaly-api-pods"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "serving pod {{ $labels.pod }} is not answering /metrics"
          description: "Prometheus could not scrape pod {{ $labels.pod }} for 30 seconds."

      - alert: ServingReplicasMissing
        expr: |
          k8s_deployment_replicas_available{deployment="anomaly-api"}
          < k8s_deployment_replicas_desired{deployment="anomaly-api"}
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "anomaly-api has {{ $value }} available replicas, fewer than desired"
          description: "Some serving replicas have been unavailable for 2 minutes (longer than a rollout)."

      - alert: PodNotReady
        expr: k8s_pod_ready{namespace="ml-serving"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "pod {{ $labels.pod }} is not Ready"
          description: "Pod {{ $labels.pod }} in ml-serving has not been Ready for 2 minutes (longer than a rollout)."

      - alert: KubernetesUnreachable
        expr: k8s_exporter_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "the Kubernetes API is not answering"
          description: "kubectl calls from the k8s exporter have failed for 30 seconds (Minikube down?)."

      - alert: PredictionsStopped
        # the production agent (or the whole serving path) stopped: no prediction served for a minute (the
        # agent sends several per second; pods are scraped every 5 s)
        expr: |
          sum(increase(api_predictions_total{job="anomaly-api-pods"}[1m])) == 0
          or absent(api_predictions_total{job="anomaly-api-pods"})
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "no predictions served for a minute"
          description: "The traffic agent or the serving path has stopped."

      - alert: DiskAlmostFull
        # SonarQube's Elasticsearch turns read-only at 95% (README, L3 run 6): warn at 90%
        expr: |
          node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"}
          / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"} < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "root disk above 90% full"
          description: "Free space on / is {{ $value | humanizePercentage }}; SonarQube goes read-only at 95%."

      - alert: MemoryLow
        # the VM froze once under memory pressure during training (README, Real bugs)
        expr: node_memory_MemAvailable_bytes{job="node-exporter"} < 1.5e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "less than 1.5 GB of memory available"
          description: "Available memory is {{ $value | humanize1024 }}B; training needs about 11 GB."
