# PostgreSQL for the feedback loop (v2.12.0).
# See README "Feedback loop and online learning" section.
#
# Deployed as a StatefulSet (not Deployment) because:
#   - Stable network identity (postgres-0.postgres) needed for API to reach it
#   - Persistent storage per-pod, tied to pod identity (not reassignable)
#   - Ordered startup: pod-0 must exist before any client tries to connect
#
# Chosen over SQLite because:
#   - Multiple API pods can safely write concurrently (client-server DB,
#     proper multi-writer support, no file locking issues)
#   - Survives node failures in a multi-node cluster
#   - Standard production database, not a demo compromise
#
# Credentials come from a Kubernetes Secret, not hardcoded env vars.
# In real production this Secret itself would be sourced from a real
# secrets manager (Vault, AWS Secrets Manager, Sealed Secrets), but
# a plain Secret is a strict improvement over the plain-text
# credentials the v2 MinIO deployment used earlier in this project.

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ml-serving
spec:
  clusterIP: None            # Headless service -> pods addressable as postgres-0.postgres
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ml-serving
spec:
  serviceName: postgres
  replicas: 1              # Single writer: the feedback store's write rate
                           # (one row per prediction) is well within one
                           # PostgreSQL instance.
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      # postgres:16-alpine's "postgres" user is uid/gid 70. Running as that
      # user from the start (instead of root + gosu) is supported by the
      # official entrypoint when the data directory is writable by it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            # writable paths PostgreSQL needs besides its data directory
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        storageClassName: standard
