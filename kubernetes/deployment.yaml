apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-api
  namespace: ml-serving
  labels:
    app: anomaly-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anomaly-api
  template:
    metadata:
      labels:
        app: anomaly-api
    spec:
      containers:
        - name: api
          image: devsecmlops-api:2.11.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_NAME
              value: "telecom_v3"
          # v3: XGBoost primary model baked into the image (3.6MB) --
          # no MinIO fetch needed, so MinIO env vars removed. Lower
          # resource footprint reflects XGBoost's much smaller size.
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
