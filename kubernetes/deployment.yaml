apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-api
  namespace: ml-serving
  labels:
    app: anomaly-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anomaly-api
  template:
    metadata:
      labels:
        app: anomaly-api
    spec:
      # The API never talks to the Kubernetes API server.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Feedback loop (v2.12.0): wait for PostgreSQL to accept connections
      # before starting the API. Prevents crash-loops on cold cluster boot
      # where PostgreSQL takes ~30s to initialize while the API can start
      # in ~5s and would otherwise fail on its first DATABASE_URL query.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: postgres-credentials
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres.ml-serving.svc.cluster.local -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for postgres..."
                sleep 2
              done
              echo "postgres ready, exiting init container"
      containers:
        - name: api
          # Jenkins owns the running image: stage 8 does `kubectl set image` to the build tag
          # (…-bNNN) and never re-applies this file, so this static tag is only the first-install default.
          image: devsecmlops-api:2.20.3
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_NAME
              value: "telecom_v3"
            # The alert threshold is not set here: the API reads it from models/manifest.json
            # (selected by the training pipeline per config/model_policy.json).
            # User, password and database all come from the Secret, so the
            # demo (generated) and production (Vault) credentials work
            # without editing this manifest. They must come BEFORE
            # DATABASE_URL: K8s substitutes $(VAR) only from vars defined
            # EARLIER in the same env array.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.ml-serving.svc.cluster.local:5432/$(POSTGRES_DB)"
            # Optional access token for POST /feedback. The Secret is created only when
            # FEEDBACK_TOKEN is set when the Ansible playbook runs; without it the variable
            # is simply absent and /feedback stays open (the demo default).
            - name: FEEDBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: feedback-token
                  key: token
                  optional: true
          # v3: XGBoost primary model baked into the image (3.6MB) --
          # no MinIO fetch needed, so MinIO env vars removed. Lower
          # resource footprint reflects XGBoost's much smaller size.
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # The root filesystem is read-only; /tmp is the only writable
          # path the API needs (tempfile usage), backed by a memory-capped
          # emptyDir.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
