# Demo-profile database credentials.
# The production profile does NOT apply this file: the `secrets` role
# creates the same Secret name from an Ansible Vault value instead.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ml-serving
type: Opaque
stringData:
  POSTGRES_USER: feedback
  POSTGRES_PASSWORD: feedback-dev-password
  POSTGRES_DB: feedback

